[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harnesslab"
version = "0.3.0"
description = "HarnessLab — MAD + awesome-harness-engineering + loop-engineering unified for Hermes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HarnessLab" }]
dependencies = [
  "PyYAML>=6.0",
]
keywords = ["hermes", "harness", "multi-agent", "debate", "github", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
harnesslab = "harnesslab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["harnesslab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
